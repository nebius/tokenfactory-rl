#[build-system]
#requires = ["setuptools>=69", "wheel"]
#build-backend = "setuptools.build_meta"

[project]
name = "tokenfactory-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.15"
dependencies = [
    "openai>=2.37.0,<3",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "tenacity>=9.1.4,<10",
    "typing-extensions~=4.15.0"
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-httpx>=0.36.2,<1",

    "ruff~=0.15.13",
    "ty~=0.0.38",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tokenfactory.*"]
namespaces = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contree_sdk"]

[tool.hatch.build.targets.sdist]
only-include = [
    "contree_sdk",
    "pyproject.toml",
    "README.md",
    "SECURITY.md",
    "LICENSE"
]

[tool.hatch.build]
only-packages = true
