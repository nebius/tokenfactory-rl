[project]
name = "tokenfactory-rl"
version = "0.0.0"
description = "Reinforcement learning utilities for TokenFactory"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10, <3.15"
dependencies = [
    "openai>=2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "tenacity>=9",
    "typing-extensions>=4"
]

[dependency-groups]
tests = [
    "pytest>=9.0.3,<10",
    "pytest-httpx>=0.36.2,<1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "tomli>=2.4.1; python_version < '3.11'",
]
dev = [
    {include-group = "tests"},
    "ruff~=0.15.22",
    "ty~=0.0.63",
]
dev-security = [
    "semgrep>=1.163.0",
]

[tool.uv]
constraint-dependencies = ["starlette>=1.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenfactory"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/tokenfactory",
    "pyproject.toml",
    "README.md",
    "SECURITY.md",
    "LICENSE"
]

[tool.hatch.build]
only-packages = true
