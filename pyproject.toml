[project]
name = "tokenfactory-rl"
version = "0.0.0"
description = "Reinforcement learning utilities for TokenFactory"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10, <3.15"
dependencies = [
    "openai>=2.50.0,<3",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "tenacity>=9.1.4,<10",
    "typing-extensions~=4.16.0"
]

[dependency-groups]
tests = [
    "pytest>=9.1.1,<10",
    "pytest-httpx>=0.36.2,<1",
    "pytest-cov",
    "pytest-html",
    "tomli; python_version < '3.11'",
]
dev = [
    {include-group = "tests"},
    "ruff~=0.16.0",
    "ty~=0.0.65",
]
dev-security = [
    "semgrep>=1.172.0,<2",
]

[tool.uv]
constraint-dependencies = ["starlette>=1.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenfactory"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/tokenfactory",
    "pyproject.toml",
    "README.md",
    "SECURITY.md",
    "LICENSE"
]

[tool.hatch.build]
only-packages = true
