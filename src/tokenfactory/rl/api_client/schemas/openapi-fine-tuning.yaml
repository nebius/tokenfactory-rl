openapi: 3.1.0
info:
  title: Nebius OpenAI-compatible inference API
  version: 20260630-e4a4e27f2
paths:
  /v1/fine_tuning/jobs:
    post:
      tags:
      - fine-tuning
      summary: Create a fine-tuning job
      description: Creates a job that fine-tunes a specified model based on a given
        dataset.
      operationId: create_fine_tuning_job_v1_fine_tuning_jobs_post
      security:
      - HTTPBearer: []
      parameters:
      - name: ai_project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Project ID to list fine tuning jobs
          title: Ai Project Id
        description: Project ID to list fine tuning jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FineTuningRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTuningJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - fine-tuning
      summary: List fine-tuning jobs
      description: Lists all fine-tuning jobs.
      operationId: list_fine_tuning_jobs_v1_fine_tuning_jobs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      - name: ai_project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Project ID to list fine tuning jobs
          title: Ai Project Id
        description: Project ID to list fine tuning jobs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTuningJobListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fine_tuning/jobs/{job_id}:
    get:
      tags:
      - fine-tuning
      summary: Get fine-tuning job info
      description: Get info about a fine-tuning job.
      operationId: get_fine_tuning_job_v1_fine_tuning_jobs__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTuningJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fine_tuning/jobs/{job_id}/cancel:
    post:
      tags:
      - fine-tuning
      summary: Cancel fine-tuning job
      description: Immediately cancel a fine-tuning job.
      operationId: cancel_fine_tuning_job_v1_fine_tuning_jobs__job_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FineTuningJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fine_tuning/jobs/{job_id}/events:
    get:
      tags:
      - fine-tuning
      summary: List fine-tuning events
      description: Get status updates for a fine-tuning job.
      operationId: list_fine_tuning_events_v1_fine_tuning_jobs__job_id__events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fine_tuning/jobs/{job_id}/checkpoints:
    get:
      tags:
      - fine-tuning
      summary: List fine-tuning checkpoints
      description: Get training checkpoints for a fine-tuning job.
      operationId: list_fine_tuning_checkpoints_v1_fine_tuning_jobs__job_id__checkpoints_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCheckpointsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fine_tuning/jobs/{job_id}/checkpoints/{checkpoint_id}:
    get:
      tags:
      - fine-tuning
      summary: Get fine-tuning checkpoint
      description: Get details about a specific checkpoint from a fine-tuning job.
      operationId: get_fine_tuning_checkpoint_v1_fine_tuning_jobs__job_id__checkpoints__checkpoint_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: checkpoint_id
        in: path
        required: true
        schema:
          type: string
          title: Checkpoint Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openai__types__fine_tuning__jobs__fine_tuning_job_checkpoint__FineTuningJobCheckpoint'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Error:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        param:
          anyOf:
          - type: string
          - type: 'null'
          title: Param
      additionalProperties: true
      type: object
      required:
      - code
      - message
      title: Error
      description: For fine-tuning jobs that have `failed`, this will contain more
        information on the cause of the failure.
    FTCheckpointParameters:
      properties:
        type:
          anyOf:
          - type: string
          - type: string
            const: ft
          title: Type
          default: ft
      type: object
      title: FTCheckpointParameters
    FineTuningJob:
      properties:
        id:
          type: string
          title: Id
        created_at:
          type: integer
          title: Created At
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
        finished_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Finished At
        hyperparameters:
          anyOf:
          - $ref: '#/components/schemas/SupervisedHParameters'
          - type: 'null'
        method:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/SupervisedMethodConfig'
            - $ref: '#/components/schemas/SpecDraftMethodConfig'
            discriminator:
              propertyName: type
              mapping:
                spec-draft: '#/components/schemas/SpecDraftMethodConfig'
                supervised: '#/components/schemas/SupervisedMethodConfig'
          - type: 'null'
          title: Method
        integrations:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/WandbIntegrationResponse'
              - $ref: '#/components/schemas/MlflowIntegrationResponse'
              - $ref: '#/components/schemas/HfExportIntegrationResponse'
            type: array
          - type: 'null'
          title: Integrations
        from_checkpoint:
          anyOf:
          - $ref: '#/components/schemas/HFCheckpointParametersResponse'
          - $ref: '#/components/schemas/FTCheckpointParameters'
          - type: 'null'
          title: From Checkpoint
        model:
          type: string
          title: Model
        object:
          type: string
          const: fine_tuning.job
          title: Object
          default: fine_tuning.job
        organization_id:
          type: string
          title: Organization Id
          default: ''
        result_files:
          items:
            type: string
          type: array
          title: Result Files
          default: []
        seed:
          type: integer
          title: Seed
          default: 0
        suffix:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Suffix
        status:
          type: string
          enum:
          - validating_files
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          title: Status
        trained_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Trained Tokens
        training_file:
          type: string
          title: Training File
        validation_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation File
        estimated_finish:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimated Finish
        trained_steps:
          anyOf:
          - type: integer
          - type: 'null'
          title: Trained Steps
        total_steps:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Steps
      additionalProperties: true
      type: object
      required:
      - id
      - created_at
      - model
      - status
      - training_file
      title: FineTuningJob
    FineTuningJobEvent:
      properties:
        id:
          type: string
          title: Id
        created_at:
          type: integer
          title: Created At
        level:
          type: string
          enum:
          - info
          - warn
          - error
          title: Level
        message:
          type: string
          title: Message
        object:
          type: string
          const: fine_tuning.job.event
          title: Object
        data:
          anyOf:
          - {}
          - type: 'null'
          title: Data
        type:
          anyOf:
          - type: string
            enum:
            - message
            - metrics
          - type: 'null'
          title: Type
      additionalProperties: true
      type: object
      required:
      - id
      - created_at
      - level
      - message
      - object
      title: FineTuningJobEvent
      description: Fine-tuning job event object
    FineTuningJobListResponse:
      properties:
        object:
          type: string
          title: Object
          description: The object type, which is always 'list'
          default: list
        data:
          items:
            $ref: '#/components/schemas/FineTuningJob'
          type: array
          title: Data
          description: List of fine-tuning jobs
        has_more:
          type: boolean
          title: Has More
          description: Whether there are more jobs to fetch
      type: object
      required:
      - data
      - has_more
      title: FineTuningJobListResponse
    FineTuningRequest:
      properties:
        model:
          type: string
          title: Model
          description: The name of the model to fine-tune
          examples:
          - meta-llama/Llama-3.1-70B-Instruct
          - meta-llama/Llama-3.1-70B
          - meta-llama/Llama-3.1-8B-Instruct
          - meta-llama/Llama-3.1-8B
        from_checkpoint:
          anyOf:
          - $ref: '#/components/schemas/HFCheckpointParametersRequest-Input'
          - $ref: '#/components/schemas/FTCheckpointParameters'
          - type: 'null'
          title: From Checkpoint
          description: Checkpoint to continue training from
        training_file:
          type: string
          title: Training File
          description: The ID of the uploaded training data file
          examples:
          - file_123456
        validation_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation File
          description: The ID of the uploaded validation data file
          examples:
          - file_123456
        hyperparameters:
          anyOf:
          - $ref: '#/components/schemas/SupervisedHParameters'
          - type: 'null'
          description: Training hyperparameters
        method:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/SupervisedMethodConfig'
            - $ref: '#/components/schemas/SpecDraftMethodConfig'
            discriminator:
              propertyName: type
              mapping:
                spec-draft: '#/components/schemas/SpecDraftMethodConfig'
                supervised: '#/components/schemas/SupervisedMethodConfig'
          - type: 'null'
          title: Method
          description: Fine-tuning method configuration
        integrations:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/WandbIntegrationRequest'
              - $ref: '#/components/schemas/MlflowIntegrationRequest'
              - $ref: '#/components/schemas/HfExportIntegrationRequest'
            type: array
          - type: 'null'
          title: Integrations
          description: Job integration paramaters
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: The seed controls the reproducibility of the job
          examples:
          - 42
        suffix:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Suffix
          description: The suffix that will be used for output model name
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: List of tags to associate with the job
          examples:
          - my-ft-job
        extra_body:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extra Body
          description: Extra params to pass to the fine-tuning job
      additionalProperties: true
      type: object
      required:
      - model
      - training_file
      title: FineTuningRequest
    HFCheckpointParametersRequest-Input:
      properties:
        type:
          anyOf:
          - type: string
          - type: string
            const: hf
          title: Type
          default: hf
        repo:
          type: string
          title: Repo
        revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Revision
        token:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Token
      type: object
      required:
      - repo
      title: HFCheckpointParametersRequest
    HFCheckpointParametersResponse:
      properties:
        type:
          anyOf:
          - type: string
          - type: string
            const: hf
          title: Type
          default: hf
        repo:
          type: string
          title: Repo
        revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Revision
      type: object
      required:
      - repo
      title: HFCheckpointParametersResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HfExportConfigRequest:
      properties:
        output_repo_name:
          type: string
          title: Output Repo Name
        api_token:
          type: string
          format: password
          title: Api Token
          writeOnly: true
      type: object
      required:
      - output_repo_name
      - api_token
      title: HfExportConfigRequest
    HfExportConfigResponse:
      properties:
        output_repo_name:
          type: string
          title: Output Repo Name
      type: object
      required:
      - output_repo_name
      title: HfExportConfigResponse
    HfExportIntegrationRequest:
      properties:
        type:
          anyOf:
          - type: string
          - type: string
            const: hf
          title: Type
          default: hf
        hf:
          $ref: '#/components/schemas/HfExportConfigRequest'
      type: object
      required:
      - hf
      title: HfExportIntegrationRequest
    HfExportIntegrationResponse:
      properties:
        type:
          anyOf:
          - type: string
          - type: string
            const: hf
          title: Type
          default: hf
        hf:
          $ref: '#/components/schemas/HfExportConfigResponse'
      type: object
      required:
      - hf
      title: HfExportIntegrationResponse
    ListCheckpointsResponse:
      properties:
        object:
          type: string
          title: Object
          default: list
        data:
          items:
            $ref: '#/components/schemas/app__models__fine_tuning__FineTuningJobCheckpoint'
          type: array
          title: Data
        first_id:
          anyOf:
          - type: string
          - type: 'null'
          title: First Id
        last_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Id
        has_more:
          type: boolean
          title: Has More
          default: false
      type: object
      required:
      - data
      title: ListCheckpointsResponse
    ListEventsResponse:
      properties:
        object:
          type: string
          title: Object
          description: The object type, which is always 'list'
          default: list
        data:
          items:
            $ref: '#/components/schemas/FineTuningJobEvent'
          type: array
          title: Data
        has_more:
          type: boolean
          title: Has More
          default: false
      type: object
      required:
      - data
      title: ListEventsResponse
    Metrics:
      properties:
        full_valid_loss:
          anyOf:
          - type: number
          - type: 'null'
          title: Full Valid Loss
        full_valid_mean_token_accuracy:
          anyOf:
          - type: number
          - type: 'null'
          title: Full Valid Mean Token Accuracy
        step:
          anyOf:
          - type: number
          - type: 'null'
          title: Step
        train_loss:
          anyOf:
          - type: number
          - type: 'null'
          title: Train Loss
        train_mean_token_accuracy:
          anyOf:
          - type: number
          - type: 'null'
          title: Train Mean Token Accuracy
        valid_loss:
          anyOf:
          - type: number
          - type: 'null'
          title: Valid Loss
        valid_mean_token_accuracy:
          anyOf:
          - type: number
          - type: 'null'
          title: Valid Mean Token Accuracy
      additionalProperties: true
      type: object
      title: Metrics
      description: Metrics at the step number during the fine-tuning job.
    MlflowConfigRequest:
      properties:
        tracking_uri:
          type: string
          title: Tracking Uri
        experiment_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Experiment Name
        run_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Name
        tags:
          additionalProperties:
            type: string
          type: object
          title: Tags
        certificate_file:
          type: string
          title: Certificate File
        certificate_file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Certificate File Id
        username:
          type: string
          title: Username
        password:
          type: string
          format: password
          title: Password
          writeOnly: true
      type: object
      required:
      - tracking_uri
      - experiment_name
      - run_name
      - certificate_file
      - username
      - password
      title: MlflowConfigRequest
    MlflowConfigResponse:
      properties:
        tracking_uri:
          type: string
          title: Tracking Uri
        experiment_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Experiment Name
        run_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Name
        tags:
          additionalProperties:
            type: string
          type: object
          title: Tags
      type: object
      required:
      - tracking_uri
      - experiment_name
      - run_name
      title: MlflowConfigResponse
    MlflowIntegrationRequest:
      properties:
        type:
          type: string
          const: mlflow
          title: Type
          default: mlflow
        mlflow:
          $ref: '#/components/schemas/MlflowConfigRequest'
      type: object
      required:
      - mlflow
      title: MlflowIntegrationRequest
    MlflowIntegrationResponse:
      properties:
        type:
          type: string
          const: mlflow
          title: Type
          default: mlflow
        mlflow:
          $ref: '#/components/schemas/MlflowConfigResponse'
      type: object
      required:
      - mlflow
      title: MlflowIntegrationResponse
    SpecDraftConfig:
      properties:
        hyperparameters:
          $ref: '#/components/schemas/SpecDraftHParameters'
      type: object
      required:
      - hyperparameters
      title: SpecDraftConfig
    SpecDraftHParameters:
      properties:
        batch_size:
          type: integer
          maximum: 64.0
          minimum: 1.0
          title: Batch Size
          description: Batch size for training
          default: 8
        learning_rate:
          type: number
          exclusiveMaximum: 1.0
          exclusiveMinimum: 0.0
          title: Learning Rate
          description: Learning rate for training
          default: 0.0075
        n_epochs:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: N Epochs
          description: Number of epochs for training
          default: 1
        warmup_ratio:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Warmup Ratio
          description: Warmup ratio for learning rate
          default: 0.0
        weight_decay:
          type: number
          minimum: 0.0
          title: Weight Decay
          description: Weight decay for optimizer
          default: 0.0
        packing:
          type: boolean
          title: Packing
          description: Whether to use packing for training
          default: true
        max_grad_norm:
          type: number
          exclusiveMinimum: 0.0
          title: Max Grad Norm
          description: Maximum gradient norm for optimizer
          default: 1.0
        context_length:
          type: integer
          maximum: 131072.0
          minimum: 8192.0
          title: Context Length
          description: Context length for training
          default: 8192
        architecture:
          type: string
          title: Architecture
          default: eagle3_original
        num_decoding_heads:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Num Decoding Heads
          description: Number of speculative decoding heads
          default: 3
        loss:
          $ref: '#/components/schemas/SpecDraftLossParams'
          description: Speculative drafter loss configuration
      additionalProperties: true
      type: object
      title: SpecDraftHParameters
    SpecDraftLossParams:
      properties:
        type:
          type: string
          enum:
          - kl
          - lk_alpha
          - lk_hybrid
          title: Type
          default: kl
      type: object
      title: SpecDraftLossParams
    SpecDraftMethodConfig:
      properties:
        type:
          type: string
          const: spec-draft
          title: Type
          default: spec-draft
        spec_draft:
          $ref: '#/components/schemas/SpecDraftConfig'
      type: object
      required:
      - spec_draft
      title: SpecDraftMethodConfig
    SupervisedConfig:
      properties:
        hyperparameters:
          $ref: '#/components/schemas/SupervisedHParameters'
      type: object
      required:
      - hyperparameters
      title: SupervisedConfig
    SupervisedHParameters:
      properties:
        batch_size:
          type: integer
          maximum: 64.0
          minimum: 1.0
          title: Batch Size
          description: Batch size for training
          default: 8
        learning_rate:
          type: number
          minimum: 0.0
          title: Learning Rate
          description: Learning rate for training
          default: 1e-05
        n_epochs:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: N Epochs
          description: Number of epochs for training
          default: 3
        warmup_ratio:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Warmup Ratio
          description: Warmup ratio for learning rate
          default: 0.0
        weight_decay:
          type: number
          minimum: 0.0
          title: Weight Decay
          description: Weight decay for optimizer
          default: 0.0
        packing:
          type: boolean
          title: Packing
