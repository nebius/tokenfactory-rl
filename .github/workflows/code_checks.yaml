name: Code checks

on:
  merge_group:
  pull_request:
  release:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pipx install uv
      - run: uv run --group dev ruff check

  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pipx install uv
      - run: uv run --group dev ruff format --check

  type-check:
    runs-on: ubuntu-latest
    needs: [ruff-check, ruff-format]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pipx install uv
      - run: uv run --group dev ty check

  uv-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pipx install uv
      - run: uv lock --check

  checks-complete:
    needs: [ruff-check, ruff-format, type-check, uv-lock]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check tests result
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: echo "✅ All tests passed"

      - name: Fail if any test failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "❌ Some tests failed, were cancelled, or were skipped"
          exit 1
